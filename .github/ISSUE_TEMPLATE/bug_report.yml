name: Bug report
description: Report a reproducible problem with TurboKiller
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include enough system information to make the issue reproducible.

  - type: input
    id: version
    attributes:
      label: TurboKiller version
      placeholder: e.g. 1.1.0
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac model
      description: Model name or identifier if known.
      placeholder: e.g. MacBookPro16,1
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: e.g. Intel Core i7-9750H
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.7
    validations:
      required: true

  - type: dropdown
    id: sip
    attributes:
      label: System Integrity Protection (SIP)
      options:
        - Enabled
        - Disabled
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open TurboKiller
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste relevant text logs or attach screenshots if available.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using an Intel Mac.
          required: true
        - label: I checked existing issues for the same problem.
          required: true
