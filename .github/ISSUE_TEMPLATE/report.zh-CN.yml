name: 反馈 — 简体中文
description: 报告问题或提交兼容性测试结果
title: "[Report] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 TurboKiller。这个表单既可以用于问题报告，也可以用于兼容性报告。

  - type: dropdown
    id: report_type
    attributes:
      label: 反馈类型
      options:
        - 问题报告
        - 兼容性报告
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TurboKiller 版本
      placeholder: 例如 1.1.0
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac 型号
      description: 如果知道，请填写机型名称或型号标识。
      placeholder: 例如 MacBookPro16,1
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: 例如 Intel Core i7-9750H
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.7
    validations:
      required: true

  - type: dropdown
    id: sip
    attributes:
      label: 系统完整性保护（SIP）
      options:
        - 已开启
        - 已关闭
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: compatibility_result
    attributes:
      label: 兼容性结果
      description: 如果是普通问题报告，请选择“不适用”。
      options:
        - 不适用 — 问题报告
        - 完全正常
        - 部分可用
        - 无法使用
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 详细信息
      description: 问题报告请说明实际发生了什么以及你原本期望的结果；兼容性报告请描述测试结果和任何异常情况。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 可复现的问题请尽量填写；兼容性报告可留空。
      placeholder: |
        1. 打开 TurboKiller
        2. ...
        3. ...

  - type: checkboxes
    id: behavior
    attributes:
      label: 哪些功能正常？
      description: 主要用于兼容性报告。
      options:
        - label: 特权 Helper 安装成功
        - label: 内核扩展已获批准并成功加载
        - label: 可以关闭 Turbo Boost
        - label: 可以重新启用 Turbo Boost
        - label: TurboKiller 显示的状态与实际状态一致

  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      description: 如有需要，请粘贴相关日志文本或附上截图。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 这份报告来自 Intel Mac。
          required: true
        - label: 我测试的是 TurboKiller 官方发行版，或本仓库未修改的构建版本。
          required: true
        - label: 我已经检查过现有 Issue，没有找到相同的问题或配置。
          required: true
